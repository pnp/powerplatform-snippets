name: Deploy gallery

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "copilot-studio/**"
      - "power-apps/**"
      - "power-automate-desktop/**"
      - "power-pages/**"
      - "assets/**"
      - "templates/**"
      - ".github/workflows/deploy-gallery.yml"
      - ".github/workflows/validate-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-gallery
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Validate and build the complete gallery
        run: |
          npm run validate:readme-trackers
          npm test
          npm run check
          npm run build
          npm run validate:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check out the deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify the live revision, snippet routes and product logos
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run deployment:verify; then
              exit 0
            fi
            echo "Live verification attempt $attempt failed; allowing CDN propagation before retry."
            sleep 10
          done
          exit 1
