    Children:
      - conWrapper:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conGalleryHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =App.Theme.Colors.Lighter60
                  FillPortions: =0
                  Height: =40
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - lblStatus:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Status"
                        Width: =ColumnWidth("Status")
                        X: =ColumnX("Status") - sldGalleryColumns.Value
                  - lblCondition:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Condition"
                        Width: =ColumnWidth("Condition")
                        X: =ColumnX("Condition") - sldGalleryColumns.Value
                  - lblWarrantyExpiry:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Warranty Expiry"
                        Width: =ColumnWidth("WarrantyExpiry")
                        X: =ColumnX("WarrantyExpiry") - sldGalleryColumns.Value
                  - lblAssignedDate:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Assigned Date"
                        Width: =ColumnWidth("AssignedDate")
                        X: =ColumnX("AssignedDate") - sldGalleryColumns.Value
                  - lblSerialNumber:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Serial Number"
                        Width: =ColumnWidth("SerialNumber")
                        X: =ColumnX("SerialNumber") - sldGalleryColumns.Value
                  - lblOS:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="OS"
                        Width: =ColumnWidth("OS")
                        X: =ColumnX("OS") - sldGalleryColumns.Value
                  - lblLocation:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Location"
                        Width: =ColumnWidth("Location")
                        X: =ColumnX("Location") - sldGalleryColumns.Value
                  - lblModel:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Model"
                        Width: =ColumnWidth("Model")
                        X: =ColumnX("Model") - sldGalleryColumns.Value
                  - lblBrand:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Brand"
                        Width: =ColumnWidth("Brand")
                        X: =ColumnX("Brand") - sldGalleryColumns.Value
                  - lblDeviceType:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Device Type"
                        Width: =ColumnWidth("DeviceType")
                        X: =ColumnX("DeviceType") - sldGalleryColumns.Value
                  - lblShadow:
                      Control: Label@2.5.1
                      Properties:
                        Fill: =Parent.Fill
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: =""
                        Width: =ColumnWidth("Shadow")
                        X: =ColumnX("Shadow")
                  - lblDepartment:
                      Control: Label@2.5.1
                      Properties:
                        Fill: =Parent.Fill
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Department"
                        Width: =ColumnWidth("Department")
                        X: =ColumnX("Department")
                  - lblEmployeeName:
                      Control: Label@2.5.1
                      Properties:
                        Fill: =Parent.Fill
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Text: ="Employee Name"
                        Width: =ColumnWidth("EmployeeName")
                        X: =ColumnX("EmployeeName")
            - galItems:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  FillPortions: =0
                  Height: =Parent.Height - Parent.PaddingBottom -Parent.PaddingTop - conGalleryHeader.Height - conSlider.Height
                  Items: =colDevices
                  TemplateSize: =56
                  Width: =Parent.Width
                Children:
                  - conGalleryRow:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =App.Theme.Colors.Lighter80
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Height: =Parent.TemplateHeight
                        Width: =Parent.Width
                      Children:
                        - lblStatusValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.Status
                              Width: =lblStatus.Width
                              X: =lblStatus.X
                        - lblConditionValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.Condition
                              Width: =lblCondition.Width
                              X: =lblCondition.X
                        - lblWarrantyExpiryValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.WarrantyExpiry
                              Width: =lblWarrantyExpiry.Width
                              X: =lblWarrantyExpiry.X
                        - lblAssignedDateValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.AssignedDate
                              Width: =lblAssignedDate.Width
                              X: =lblAssignedDate.X
                        - lblSerialNumberValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.SerialNumber
                              Width: =lblSerialNumber.Width
                              X: =lblSerialNumber.X
                        - lblOSValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.OS
                              Width: =lblOS.Width
                              X: =lblOS.X
                        - lblLocationValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.Location
                              Width: =lblLocation.Width
                              X: =lblLocation.X
                        - lblModelValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.Model
                              Width: =lblModel.Width
                              X: =lblModel.X
                        - lblBrandValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.Brand
                              Width: =lblBrand.Width
                              X: =lblBrand.X
                        - lblDeviceTypeValue:
                            Control: Label@2.5.1
                            Properties:
                              Height: =Parent.Height
                              Text: =ThisItem.DeviceType
                              Width: =lblDeviceType.Width
                              X: =lblDeviceType.X
                        - htmShadow:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              Height: =Parent.Height
                              HtmlText: |+
                                ="<div style='width:" & Self.Width & "px;height:" & (Self.Height - 1) & "px;background:linear-gradient(to right, " & Mid(JSON(App.Theme.Colors.Lighter80), 2, 7) & ", transparent);'></div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Width: =lblShadow.Width
                              X: =lblShadow.X
                        - lblDepartmentValue:
                            Control: Label@2.5.1
                            Properties:
                              Fill: =App.Theme.Colors.Lighter80
                              Height: =Parent.Height
                              Text: =ThisItem.Department
                              Width: =lblDepartment.Width
                              X: =lblDepartment.X
                        - lblEmployeeNameValue:
                            Control: Label@2.5.1
                            Properties:
                              Fill: =App.Theme.Colors.Lighter80
                              Height: =Parent.Height
                              Text: =ThisItem.EmployeeName
                              Width: =lblEmployeeName.Width
                              X: =lblEmployeeName.X
            - conSlider:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.End
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =18
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - lblEmployeeName.Width - lblDepartment.Width
                Children:
                  - sldGalleryColumns:
                      Control: Classic/Slider@2.1.0
                      Properties:
                        Default: =0
                        FocusedBorderColor: =Color.Transparent
                        HandleSize: =8
                        Height: =16
                        HoverBorderColor: =Color.Transparent
                        Max: |
                          =Sum(Filter(colColumnConfig, ColumnIdx > 20), Width) - (conWrapper.Width - ColumnWidth("EmployeeName") - ColumnWidth("Department"))
                        RailThickness: =2
                        ShowValue: =false
                        Width: =Parent.Width
