# BRICK CLUB - CLUBHOUSE WELCOME PAGE
# Full-page Power Apps Studio Paste code snippet. Native text/buttons + inline SVG art.
# No media uploads, external images, HTML, Power Apps timers, data sources, or fake statistics.
# Motion: rocket hovers 6 SVG units over 4.5s; sparkles pulse gently over 3.8s.
# Both effects run within imgClubhouseRocket SVG. Layout/text/buttons stay still.
# Remove animateTransform and animate elements in the SVG for a static version.
# SVG playback needs testing in the target browser and mobile player.
#
# INSTALL
# 1. Create a blank screen first. Paste this whole file onto the SCREEN itself.
#    Do not paste it into the old short header or one of the generated white cards.
# 2. Disable Scale to fit. Root fills its parent. The root scrolls vertically.
# 3. Preview desktop, tablet and phone. The three tiles stack below 760px content width.
# 4. Replace navigation placeholders before making it your app's home screen.
# 5. Once ready, use this screen's real identifier in App.StartScreen.
#
# NAVIGATION
# Four buttons require wiring: hero CTA and each of the three tile buttons.
# Replace Notify only with Navigate(YourActualScreen, ScreenTransition.None).
# The Set statements use the same varHeaderActiveKey as the original Brick Club header.
# There are no nonexistent screen references outside the placeholder message strings.
#
# CUSTOMIZE
# Brand: lblClubhouseBrand.Text and lblClubhouseBrandSub.Text.
# Hero: lblClubhouseHeroTitle / Body / Kicker Text.
# Tile content: lblClubhouseTileTitle1-3 / Body1-3, button Text.
# Palette: #FFD500 yellow, #0055BF blue, #D62828 red, #237841 green.
# Matching SVG artwork uses the same fills. Replace both native and SVG color values.
# Art is decorative. Page text and buttons remain native and editable.
# User().FullName appears only in the desktop greeting. No member table is required.
#
# Existing table mappings: Challenges / Build Entries / Members.
# Root scrolls rather than shrinking the content into a tiny phone viewport.
# Minimum supported screen width: 320px. Very long replacement text needs a fit check.
# Font syntax: Font.'Open Sans'. No AccessibleLabel on Classic/Button.
# Responsive revision: wrapped labels use AutoHeight and following controls reference
# actual label bottoms. Hero, tile, footer and scroll-canvas heights follow content.
# YAML/SVG syntax and dependency layout checked; not compiled in your Studio.
# Source: https://learn.microsoft.com/en-us/power-apps/maker/canvas-apps/build-responsive-apps

- conClubhouseWelcome:
