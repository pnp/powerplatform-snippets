ComponentDefinitions:
  comp_chip:
    DefinitionType: CanvasComponent
    CustomProperties:
      Height_Dyn:
        PropertyKind: Output
        DisplayName: Height_Dyn
        Description: A custom property
        DataType: Number
      HideExpand:
        PropertyKind: Input
        DisplayName: HideExpand
        Description: A custom property
        DataType: Boolean
        Default: =false
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: A custom property
        RaiseOnReset: true
        DataType: Table
        Default: |+
          =[
              { Title: "Tous", Color: "#0F043C" },
              { Title: "Canvas Components", Color: "#D32E33" },
              { Title: "Contrôles PCF", Color: "#54D3FE" },
              { Title: "Power Automate", Color: "#29E299" },
              { Title: "Copilot Studio", Color: "#B311EC" }/* ,
              { Title: "Power Pages", Color: "#F8AB08" },
              { Title: "Design Tokens", Color: "#FA4DB2" },
              { Title: "Dataverse", Color: "#3182FF" },  
              { Title: "Power BI", Color: "#F2C811" },   
              { Title: "Solutions", Color: "#5F5F5F" },  
              { Title: "Gouvernance", Color: "#B0252A" },
              { Title: "Sécurité", Color: "#2A1C6B" },   
              { Title: "ALM", Color: "#1B0F52" },        
              { Title: "Connecteurs", Color: "#54D3FE" },
              { Title: "Modèles IA", Color: "#B311EC" }, 
              { Title: "Architecture", Color: "#0F043C" },
              { Title: "Best Practices", Color: "#29E299" },
              { Title: "Accessibilité", Color: "#FA4DB2" }, 
              { Title: "Performance", Color: "red" }  */   
          ]
      Selected:
        PropertyKind: Output
        DisplayName: Selected
        Description: A custom property
        DataType: Record
      WithDyn:
        PropertyKind: OutputFunction
        DisplayName: WithDyn
        Description: A custom property
        DataType: Text
        Parameters:
          - Txt:
              Description: A parameter
              DataType: Text
              Default: ="Text"
          - Size:
              Description: A parameter
              DataType: Number
              Default: =100
    Properties:
      ChildTabPriority: |-
        =/*Steve BOURDIN 2026 - MOCA*/
        true
      Height: =comp_chip.Height_Dyn
      Height_Dyn: =cont_chip.Height
      OnReset: =Set(glb_choice , First(comp_chip.Items).Title);Set(glb_expand,true)
      Selected: |-
        ={Value : glb_choice}
      WithDyn: |+
        =With(
            {
                txt: Txt,
                s: Size,
                coef: If(Len(Txt)<5,1, 0.62)   // coefficient moyen largeur/hauteur d’un caractère
            },
            Max(40, Len(txt) * s * coef + 12)
        )
    Children:
      - cont_chip:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: |-
              =If(
                  glb_expand = false,
                  1.5*cont_chip1.Height + Self.PaddingBottom + Self.PaddingTop,
                  With(
                      {
                          chips: ForAll(
                              Filter(
                                  [
                                      cont_chip1,
                                      cont_chip2,
                                      cont_chip3,
                                      cont_chip4,
                                      cont_chip5,
                                      cont_chip6,
                                      cont_chip7,
                                      cont_chip8,
                                      cont_chip9,
                                      cont_chip10,
                                      cont_chip11,
                                      cont_chip12,
                                      cont_chip13,
                                      cont_chip14,
                                      cont_chip15,
                                      cont_chip16,
                                      cont_chip17,
                                      cont_chip18,
                                      cont_chip19,
                                      cont_chip20
                                  ],
                                  Value.Visible = true
                              ),
                              {W: Value.Width}
                          ),
                          maxWidth: cont_chip.Width,
                          gapX: cont_chip.LayoutGap,
                          gapY: cont_chip.LayoutGap// ou un autre gap vertical si tu en as un
                      },
                      With(
                          {
                              lineCount: RoundUp(
                                  (Sum(
                                      chips,
                                      W
                                  ) + Max(
                                      CountRows(chips) - 1,
                                      0
                                  ) * gapX) / maxWidth,
                                  0
                              )
                          },
                          lineCount * cont_chip1.Height + Max(
                              lineCount - 1,
                              0
                          ) * gapY
                      )
                  ) + 10
              )
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =20
            LayoutOverflowX: =LayoutOverflow.Scroll
            LayoutWrap: =glb_expand=true
            PaddingRight: =btn_expand.Width
            PaddingTop: =If(glb_expand=false,btn_expand.Height,2)
            Width: =Parent.Width
          Children:
            - cont_chip1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(231, 230, 238, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =If(glb_choice=txt_chip1.Text,RGBA(14, 4, 58, 1),Color.White)
                  FillPortions: =0
                  Height: =txt_chip1.Height*1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =txt_chip1.Height*1.5
                  LayoutMinHeight: =txt_chip1.Height*1.5
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =15
                  PaddingRight: =15
                  PaddingTop: =8
                  RadiusBottomLeft: =30
                  RadiusBottomRight: =30
                  RadiusTopLeft: =30
                  RadiusTopRight: =30
                  Visible: =CountRows(comp_chip.Items)>=Value(txt_index1.Text)
                  Width: =img_chip1.Width+Self.LayoutGap+txt_chip1.Width+Self.PaddingRight+Self.PaddingLeft
                Children:
                  - img_chip1:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =txt_chip1.Text
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =cont_chip1.Height/4
                        Image: =If(CountRows(comp_chip.Items)>=Value(txt_index1.Text),"data:image/svg+xml;utf8, "&EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><circle cx='4' cy='4' r='3' fill='"&Index(comp_chip.Items,Value(txt_index1.Text)).Color &"'></circle></svg>"))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Self.Height
                  - txt_chip1:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =If(glb_choice=Self.Text,Color.White,RGBA(14, 4, 58, 1))
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(glb_choice , Self.Text)
                        Text: =If(CountRows(comp_chip.Items)>=Value(txt_index1.Text), Index(comp_chip.Items, Value(txt_index1.Text)).Title)
                        Width: |+
                          =comp_chip.WithDyn(Self.Text,Self.Size)
                  - txt_index1:
                      Control: ModernText@1.0.0
                      Properties:
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: ="1"
                        Visible: =false
